<div class="max-w-[1600px] mx-auto space-y-8 pb-12">
  <!-- Cabecera Premium -->
  <div class="flex items-center justify-between animate-fade-in">
    <div>
      <h1 class="text-3xl font-black text-gray-900 tracking-tight flex items-center gap-3">
        Proveedores
        <span class="px-2.5 py-1 rounded-lg bg-primary-50 text-primary-600 text-xs font-bold border border-primary-100">
          {{ stats().total }} Registros
        </span>
      </h1>
      <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mt-1">Gestión de Socios Estratégicos y Abastecimiento</p>
    </div>
    <app-button variant="primary" (clicked)="crearNuevo()" iconNameLeft="ADD" class="shadow-lg shadow-primary-500/20">
      Nuevo Proveedor
    </app-button>
  </div>

  <!-- KPIs de Resumen -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 animate-slide-up">
    <!-- Card 1: Total -->
    <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md transition-all group overflow-hidden relative">
      <div class="flex items-center gap-4 relative z-10">
        <div class="w-12 h-12 rounded-2xl bg-primary-50 flex items-center justify-center text-primary-500 group-hover:scale-110 transition-transform">
          <span class="w-6 h-6 block" [innerHTML]="icons.TRUCK | safeHtml"></span>
        </div>
        <div>
          <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Total Proveedores</p>
          <p class="text-2xl font-black text-gray-900">{{ stats().total }}</p>
        </div>
      </div>
      <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-primary-50/30 rounded-full blur-2xl group-hover:scale-150 transition-transform"></div>
    </div>

    <!-- Card 2: Formalizados -->
    <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md transition-all group overflow-hidden relative">
      <div class="flex items-center gap-4 relative z-10">
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 flex items-center justify-center text-emerald-500 group-hover:scale-110 transition-transform">
          <span class="w-6 h-6 block" [innerHTML]="icons.VERIFIED | safeHtml"></span>
        </div>
        <div>
          <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Formalizados (RUC)</p>
          <p class="text-2xl font-black text-gray-900">{{ stats().conRuc }}</p>
        </div>
      </div>
      <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-emerald-50/30 rounded-full blur-2xl group-hover:scale-150 transition-transform"></div>
    </div>

    <!-- Card 3: Atención -->
    <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm hover:shadow-md transition-all group overflow-hidden relative">
      <div class="flex items-center gap-4 relative z-10">
        <div class="w-12 h-12 rounded-2xl bg-amber-50 flex items-center justify-center text-amber-500 group-hover:scale-110 transition-transform">
          <span class="w-6 h-6 block" [innerHTML]="icons.INFO | safeHtml"></span>
        </div>
        <div>
          <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Sin Contacto Asignado</p>
          <p class="text-2xl font-black text-gray-900">{{ stats().sinContacto }}</p>
        </div>
      </div>
      <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-amber-50/30 rounded-full blur-2xl group-hover:scale-150 transition-transform"></div>
    </div>
  </div>

  <!-- Barra de Búsqueda Avanzada -->
  <div class="bg-white/80 backdrop-blur-xl border border-white/20 p-6 rounded-3xl shadow-premium animate-slide-up" style="animation-delay: 100ms">
    <div class="flex flex-col lg:flex-row gap-6 items-center">
      <!-- Búsqueda Principal -->
      <div class="relative flex-1 group w-full">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-primary-500 transition-colors">
          <span class="w-5 h-5 block" [innerHTML]="icons.SEARCH | safeHtml"></span>
        </span>
        <input
          type="text"
          [ngModel]="searchTerm()"
          (ngModelChange)="onSearchChange($event)"
          placeholder="Buscar por Razón Social, RUC o Contacto..."
          class="w-full pl-12 pr-12 py-3.5 bg-gray-50 border border-gray-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 focus:bg-white transition-all text-sm font-medium"
        />
        @if (searchTerm()) {
          <button 
            (click)="onSearchChange('')"
            class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 transition-colors"
          >
            <span class="w-5 h-5 block" [innerHTML]="icons.CANCEL | safeHtml"></span>
          </button>
        }
      </div>
      
      <!-- Herramientas de Datos Reutilizables -->
      <app-table-tools
        (importExcel)="onImportExcel($event)"
        (exportExcel)="exportToExcel()"
        (exportPdf)="exportToPdf()"
        (downloadTemplate)="onDownloadTemplate()"
      ></app-table-tools>

      <!-- Filtros Rápidos -->
      <div class="flex items-center gap-2 w-full lg:w-auto overflow-x-auto pb-2 lg:pb-0 border-l lg:border-gray-100 lg:pl-6">
        <button 
          (click)="onStatusFilterChange('activo')"
          [class.bg-primary-500]="statusFilter() === 'activo'"
          [class.text-white]="statusFilter() === 'activo'"
          [class.bg-white]="statusFilter() !== 'activo'"
          [class.text-gray-500]="statusFilter() !== 'activo'"
          class="px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap shadow-md shadow-primary-500/10 transition-all border border-transparent"
        >
          Activos
        </button>
        <button 
          (click)="onStatusFilterChange('inactivo')"
          [class.bg-primary-500]="statusFilter() === 'inactivo'"
          [class.text-white]="statusFilter() === 'inactivo'"
          [class.bg-white]="statusFilter() !== 'inactivo'"
          [class.text-gray-500]="statusFilter() !== 'inactivo'"
          class="px-4 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap border border-gray-100 hover:bg-gray-50 transition-all"
        >
          Inactivos
        </button>
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="animate-slide-up" style="animation-delay: 200ms">
    <app-table
      [columns]="columns"
      [data]="filteredProveedores()"
      [loading]="proveedoresService.loading()"
      [searchTerm]="searchTerm()"
      [actions]="actions"
      emptyCtaLabel="Registrar Primer Proveedor"
      emptyCtaIcon="ADD"
      (emptyCtaClicked)="crearNuevo()"
    ></app-table>
  </div>

  <!-- Modal de Edición/Creación de Proveedor -->
  <app-modal
    [isOpen]="showModalEdicion()"
    [title]="idProveedorEdicion() ? 'Editar Proveedor' : 'Nuevo Proveedor'"
    size="xl"
    (closed)="showModalEdicion.set(false)"
  >
    @if (showModalEdicion()) {
      <app-proveedor-form 
        [id]="idProveedorEdicion() || undefined"
        [isModalMode]="true"
        (saved)="onProveedorSaved()"
        (cancelled)="showModalEdicion.set(false)"
      ></app-proveedor-form>
    }
  </app-modal>
</div>
