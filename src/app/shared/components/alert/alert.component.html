<div class="fixed top-20 left-1/2 -translate-x-1/2 z-[9999] w-full max-w-[420px] px-4 pointer-events-none">
  <div class="flex flex-col gap-3 pointer-events-auto">
    @for (alert of alertService.alerts(); track alert.id) {
      <div
        [class]="getAlertClasses(alert.type)"
        class="animate-slide-up"
      >
        <div class="flex items-start gap-3">
          <span class="w-6 h-6 flex-shrink-0 mt-0.5" [innerHTML]="getIcon(alert.type) | safeHtml"></span>
          <p class="flex-1 text-sm font-semibold leading-snug">{{ alert.message }}</p>
          <button
            (click)="alertService.remove(alert.id)"
            class="flex-shrink-0 p-1 rounded-lg text-current opacity-70 hover:opacity-100 hover:bg-black/5 transition-all"
            aria-label="Cerrar notificación"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    }
  </div>
</div>
